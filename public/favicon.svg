<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18422B" />
      <stop offset="100%" stop-color="#081A10" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE6B3" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A47734" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Luxury Forest Background with Gold Border -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <rect x="9" y="9" width="110" height="110" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.45" />

  <!-- Botanical Sandalwood Crown at Top -->
  <g transform="translate(64, 26) scale(0.75)" fill="url(#goldGrad)">
    <path d="M0 -14 C3 -7 10 -4 14 0 C9 2 4 1 0 -5 C-4 1 -9 2 -14 0 C-10 -4 -3 -7 0 -14 Z" />
    <circle cx="0" cy="-17" r="2.5" />
    <circle cx="-10" cy="-6" r="2" />
    <circle cx="10" cy="-6" r="2" />
  </g>

  <!-- Bold Luxury 73 Monogram -->
  <text 
    x="64" 
    y="78" 
    font-family="'Cormorant Garamond', 'Georgia', 'Playfair Display', serif" 
    font-size="52" 
    font-weight="800" 
    letter-spacing="-1.5" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    filter="url(#goldGlow)"
  >73</text>

  <!-- HILLS Wordmark -->
  <text 
    x="64" 
    y="98" 
    font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
    font-size="11.5" 
    font-weight="800" 
    letter-spacing="4" 
    fill="#FCE6B3" 
    text-anchor="middle"
  >HILLS</text>
</svg>
